name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Binary and Create Release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install System Dependencies (GTK4 & Libadwaita)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-dev \
            libgtk-4-dev \
            libadwaita-1-dev \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            libgirepository1.0-dev \
            libglib2.0-dev \
            gobject-introspection \
            libcairo2-dev \
            pkg-config \
            ninja-build \
            meson

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip build wheel setuptools
          pip install pycairo "PyGObject<3.48.0" pyinstaller pyinstaller-hooks-contrib

      - name: Build Standalone Executable with PyInstaller
        run: |
          pyinstaller \
            --name mannux \
            --onefile \
            --windowed \
            --collect-all gi \
            --collect-all mannux \
            --add-data "data:data" \
            mannux/__main__.py

      - name: Build Python Package Distribution (Wheel & sdist)
        run: |
          python -m build

      - name: Prepare Release Bundle
        run: |
          mkdir -p release-bundle/mannux-linux-x86_64
          cp dist/mannux release-bundle/mannux-linux-x86_64/
          cp -r data release-bundle/mannux-linux-x86_64/
          cp install.sh release-bundle/mannux-linux-x86_64/
          cp README.md release-bundle/mannux-linux-x86_64/

          cd release-bundle
          tar -czvf ../mannux-linux-x86_64.tar.gz mannux-linux-x86_64/
          cd ..

          # Copy standalone binary
          cp dist/mannux mannux-x86_64

          # Compute Checksums
          sha256sum mannux-x86_64 mannux-linux-x86_64.tar.gz dist/*.whl dist/*.tar.gz > SHA256SUMS.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mannux-build-artifacts
          path: |
            mannux-x86_64
            mannux-linux-x86_64.tar.gz
            dist/*.whl
            dist/*.tar.gz
            SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            mannux-x86_64
            mannux-linux-x86_64.tar.gz
            dist/*.whl
            dist/*.tar.gz
            SHA256SUMS.txt
